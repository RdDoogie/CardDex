<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191D32" />
  <title>Binder Builder · CardDex</title>
  <meta name="description" content="Plan your binder pages pocket by pocket (Michi method)." />

  <!-- Fuentes: Poppins (títulos/logo) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN) + configuración de marca + estilos propios -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="binder">

  <!-- El header, el menú lateral y el marco del teléfono los añade js/layout.js -->
  <main id="main" class="px-4 pt-5 pb-16" aria-labelledby="binder-title">
    <h1 id="binder-title" class="font-display font-bold text-[28px] leading-tight">Binder builder</h1>
    <p class="text-sm text-dark/60">Michi method · plan each page before sleeving</p>

    <!-- Controles: 9 / 12 pockets y Fusion Pockets -->
    <div class="mt-4 flex items-center justify-between gap-2">
      <div class="inline-flex rounded-xl bg-dark/5 p-1" role="group" aria-label="Pockets per page">
        <button type="button" data-layout="9" class="layout-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition duration-200">9 Pockets</button>
        <button type="button" data-layout="12" class="layout-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition duration-200">12 Pockets</button>
      </div>
      <button id="fusionBtn" type="button" aria-pressed="false"
              class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border border-dark/15 bg-white transition duration-200 hover:scale-[1.03] active:scale-95">
        <span data-icon="merge" class="w-4 h-4"></span>Fusion Pockets
      </button>
    </div>

    <!-- Hoja del archivador (los huecos los genera binder.js) -->
    <section class="mt-4 relative rounded-2xl bg-dark p-3 pl-7 shadow-card overflow-hidden" aria-label="Binder page">
      <!-- Agujeros de las anillas -->
      <div class="absolute left-2 inset-y-0 flex flex-col justify-around py-10" aria-hidden="true">
        <span class="w-2.5 h-2.5 rounded-full bg-bg/90"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-bg/90"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-bg/90"></span>
      </div>
      <div class="absolute inset-0 pointer-events-none bg-gradient-to-br from-white/5 to-transparent" aria-hidden="true"></div>
      <div id="sheet" class="sheet relative grid gap-2" role="grid" aria-label="Pockets"></div>
      <p id="pageLabel" class="relative mt-2 text-center text-[10px] uppercase tracking-[.2em] text-white/40">Page 1 · 9 pockets</p>
    </section>
    <p id="binderHint" class="mt-3 text-center text-xs text-dark/60 min-h-[1rem]" aria-live="polite"></p>

    <!-- Carrusel: Your cards | Images -->
    <section class="mt-4" aria-label="Your cards">
      <div class="flex items-center justify-center gap-2 text-sm font-semibold" role="tablist" aria-label="Card source">
        <button type="button" role="tab" data-tab="cards" class="tab-btn px-1 py-0.5 transition">Your cards</button>
        <span class="text-dark/25" aria-hidden="true">|</span>
        <button type="button" role="tab" data-tab="images" class="tab-btn px-1 py-0.5 transition">Images</button>
      </div>
      <div class="mt-3 flex items-center gap-1.5">
        <button type="button" id="carPrev" aria-label="Scroll cards left" class="shrink-0 w-8 h-20 rounded-xl border border-dark/10 bg-white grid place-items-center text-dark/70 transition duration-200 hover:bg-dark hover:text-white active:scale-95"><span data-icon="chevronLeft" class="w-4 h-4"></span></button>
        <div id="carousel" class="flex-1 flex gap-2.5 overflow-x-auto snap-x snap-mandatory no-scrollbar py-2 px-0.5 scroll-smooth"></div>
        <button type="button" id="carNext" aria-label="Scroll cards right" class="shrink-0 w-8 h-20 rounded-xl border border-dark/10 bg-white grid place-items-center text-dark/70 transition duration-200 hover:bg-dark hover:text-white active:scale-95"><span data-icon="chevronRight" class="w-4 h-4"></span></button>
      </div>
      <input id="binderUpload" type="file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true" />
    </section>
  </main>

  <!-- Scripts: datos → utilidades → estructura común → lógica de la página -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/binder.js"></script>
</body>
</html>
