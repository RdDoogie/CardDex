<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191D32" />
  <title>AI Card Grader · CardDex</title>
  <meta name="description" content="Pre-grade your Pokémon card before sending it to PSA." />

  <!-- Fuentes: Poppins (títulos/logo) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN) + configuración de marca + estilos propios -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="grader">

  <!-- El header, el menú lateral y el marco del teléfono los añade js/layout.js -->
  <main id="main" class="px-4 pt-5 pb-16" aria-labelledby="grader-title">
    <h1 id="grader-title" class="font-display font-bold text-[28px] lg:text-4xl leading-tight">AI card grader</h1>
    <p class="text-sm lg:text-base text-dark/60">Pre-grade your card before sending it to PSA.</p>

    <!-- Escritorio: subida a la izquierda, análisis a la derecha -->
    <div class="lg:mt-6 lg:grid lg:grid-cols-2 lg:gap-12 lg:items-start">

    <!-- Zona de subida -->
    <section class="mt-4 lg:mt-0 lg:p-6 rounded-2xl border-2 border-dashed border-dark/20 bg-white p-4" aria-labelledby="upload-title">
      <h2 id="upload-title" class="text-center font-display font-semibold text-[15px] leading-snug">Upload your card front and back image</h2>
      <p class="text-center text-xs text-dark/50 mt-0.5">Images stay on your device — nothing is uploaded.</p>
      <div class="mt-4 grid grid-cols-2 gap-3">
        <!-- Hueco Front -->
        <label class="group block cursor-pointer rounded-2xl focus-within:ring-2 focus-within:ring-red1 focus-within:ring-offset-2">
          <input id="frontInput" type="file" accept="image/*" class="sr-only" />
          <div id="frontSlot" class="relative aspect-[63/88] rounded-2xl bg-dark/[.04] border border-dark/10 grid place-items-center overflow-hidden transition duration-200 group-hover:border-red1/50 group-hover:bg-red1/5"></div>
          <p class="mt-2 text-center text-xs font-semibold">Front <span class="text-red1">*</span></p>
        </label>
        <!-- Hueco Back -->
        <label class="group block cursor-pointer rounded-2xl focus-within:ring-2 focus-within:ring-red1 focus-within:ring-offset-2">
          <input id="backInput" type="file" accept="image/*" class="sr-only" />
          <div id="backSlot" class="relative aspect-[63/88] rounded-2xl bg-dark/[.04] border border-dark/10 grid place-items-center overflow-hidden transition duration-200 group-hover:border-red1/50 group-hover:bg-red1/5"></div>
          <p class="mt-2 text-center text-xs font-semibold">Back</p>
        </label>
      </div>
      <button id="sampleBtn" type="button" class="mt-4 w-full inline-flex items-center justify-center gap-2 rounded-xl border border-dark/15 py-2.5 text-sm font-semibold transition duration-200 hover:bg-dark hover:text-white active:scale-[.98]">
        <span data-icon="image" class="w-4 h-4"></span>Use sample card
      </button>
    </section>

    <div class="lg:rounded-2xl lg:border lg:border-dark/10 lg:bg-white lg:p-6 lg:shadow-soft">
    <h2 class="hidden lg:block font-display font-semibold text-lg">Analysis</h2>
    <!-- Barras de progreso (grader.js) -->
    <section id="bars" class="mt-6 lg:mt-4 space-y-4" aria-label="Grading criteria"></section>

    <!-- Botón principal (desactivado hasta tener la imagen frontal) -->
    <button id="gradeBtn" type="button" disabled
            class="mt-6 w-full inline-flex items-center justify-center gap-2 rounded-2xl bg-red1 text-white py-4 font-display font-semibold text-base shadow-[0_12px_24px_-10px_rgba(231,14,2,.7)]
                   transition duration-200 enabled:hover:bg-red2 enabled:active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none">
      Submit for AI Grading
    </button>

    <!-- Tarjeta de resultado -->
    <section id="gradeResult" class="hidden mt-6 rounded-2xl bg-dark text-white p-5 shadow-card relative overflow-hidden" aria-live="polite" aria-label="Grading result">
      <div class="absolute -right-10 -bottom-10 w-40 h-40 rounded-full bg-yellow/20 blur-3xl" aria-hidden="true"></div>
      <p class="relative text-xs uppercase tracking-[.18em] text-white/60">Estimated grade</p>
      <div class="relative flex items-end gap-3 mt-1">
        <p id="gradeValue" class="font-display font-bold text-7xl leading-none text-yellow">9</p>
        <p id="gradeLabel" class="pb-2 font-display font-semibold text-lg">MINT</p>
      </div>
      <p id="gradeSummary" class="relative mt-3 text-sm text-white/75 leading-relaxed"></p>
      <button id="resetGrade" type="button" class="relative mt-4 w-full rounded-xl bg-white text-dark py-3 text-sm font-semibold transition duration-200 hover:bg-yellow active:scale-[.98]">Grade another card</button>
    </section>
    </div>
    </div>
  </main>

  <!-- Scripts: datos → utilidades → estructura común → lógica de la página -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/grader.js"></script>
</body>
</html>
