<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#191D32" />
  <title>Card Details · CardDex</title>
  <meta name="description" content="Card details, last sold price and price history." />

  <!-- Fuentes: Poppins (títulos/logo) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN) + configuración de marca + estilos propios -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="card">

  <!-- El header, el menú lateral y el marco del teléfono los añade js/layout.js -->
  <main id="main" class="px-4 pt-5 pb-16" aria-labelledby="cardName">

    <!-- Escritorio: carta fija a la izquierda, información a la derecha -->
    <div class="lg:grid lg:grid-cols-[minmax(0,380px)_minmax(0,1fr)] lg:gap-14 lg:items-start">
    <div class="lg:sticky lg:top-24">
    <!-- Imagen de la carta + desplegable de acciones -->
    <div class="relative mx-auto w-[74%] max-w-[290px] lg:w-full lg:max-w-[380px]">
      <!-- La imagen la inserta card.js (con fallback si no carga) -->
      <div id="holoCard" class="holo relative rounded-2xl shadow-card cursor-pointer select-none aspect-[63/88] bg-dark/5"></div>

      <div class="absolute top-2.5 left-2.5 z-20">
        <button id="actionsBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="actionsMenu" aria-label="Card actions"
                class="w-9 h-9 rounded-xl bg-white text-dark shadow-soft border border-dark/10 grid place-items-center transition duration-200 hover:scale-105 active:scale-95">
          <span id="actionsChevron" data-icon="chevronDown" class="w-5 h-5 transition-transform duration-200"></span>
        </button>
        <div id="actionsMenu" role="menu" aria-labelledby="actionsBtn"
             class="menu-pop closed absolute top-11 left-0 w-52 rounded-2xl bg-white shadow-card border border-dark/10 p-1.5 text-sm">
          <button type="button" role="menuitem" data-action="state" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-dark/5 transition"><span data-icon="shield" class="w-4 h-4 text-dark/60"></span>Change state</button>
          <button type="button" role="menuitem" data-action="language" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-dark/5 transition"><span data-icon="globe" class="w-4 h-4 text-dark/60"></span>Change language</button>
          <button type="button" role="menuitem" data-action="refresh" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-dark/5 transition"><span id="refreshIcon" data-icon="refresh" class="w-4 h-4 text-dark/60"></span>Refresh price</button>
          <div class="my-1 h-px bg-dark/10" role="separator"></div>
          <button type="button" role="menuitem" data-action="delete" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-red1 font-medium hover:bg-red1/10 transition"><span data-icon="trash" class="w-4 h-4"></span>Delete</button>
        </div>
      </div>
    </div>
    <p class="mt-3 text-center text-[11px] text-dark/45">Tap the card for a holo effect</p>
    </div>

    <div>
    <!-- Información de la carta (card.js la rellena según ?id= de la URL) -->
    <section class="mt-4 lg:mt-0" aria-label="Card information">
      <h1 id="cardName" class="font-display font-bold text-2xl lg:text-4xl leading-tight">&nbsp;</h1>
      <p id="cardSet" class="text-sm lg:text-base font-medium text-dark/60">&nbsp;</p>
      <div class="mt-3 flex flex-wrap gap-2">
        <span class="inline-flex items-center gap-1.5 rounded-full bg-dark/5 px-3 py-1 text-xs"><span data-icon="globe" class="w-3.5 h-3.5 text-dark/50"></span>Language: <b id="chipLang" class="font-semibold">English</b></span>
        <span class="inline-flex items-center gap-1.5 rounded-full bg-dark/5 px-3 py-1 text-xs"><span data-icon="shield" class="w-3.5 h-3.5 text-dark/50"></span>Condition: <b id="chipCond" class="font-semibold">NM</b></span>
      </div>

      <!-- Último precio (amarillo sobre fondo oscuro para buen contraste) -->
      <div class="mt-4 rounded-2xl bg-dark text-white p-4 flex items-end justify-between shadow-card">
        <div>
          <p class="text-xs text-white/60 font-medium">Last sold</p>
          <p id="lastSold" class="font-display font-bold text-[34px] leading-none text-yellow inline-block origin-left">900 €</p>
        </div>
        <div class="text-right">
          <span id="priceDelta"></span>
          <p class="mt-1 text-[11px] text-white/50">vs. 30 days ago</p>
        </div>
      </div>
    </section>

    <!-- Gráfico de historial de precio (lo dibuja card.js) -->
    <section class="mt-5 rounded-2xl bg-white border border-dark/10 p-4 shadow-soft" aria-labelledby="chart-title">
      <div class="flex items-center justify-between gap-2">
        <h2 id="chart-title" class="font-display font-semibold text-base">Price history</h2>
        <div class="inline-flex rounded-xl bg-dark/5 p-1" role="group" aria-label="Chart range">
          <button type="button" data-range="1M" class="range-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition duration-200">1M</button>
          <button type="button" data-range="3M" class="range-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition duration-200">3M</button>
          <button type="button" data-range="1Y" class="range-btn px-2.5 py-1 rounded-lg text-xs font-semibold transition duration-200">1Y</button>
        </div>
      </div>
      <div class="mt-2 flex items-center gap-4 text-xs text-dark/70">
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-1 rounded-full bg-dark"></span>Raw (NM)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-3 h-1 rounded-full bg-red1"></span>Graded PSA 10</span>
      </div>
      <svg id="chart" viewBox="0 0 320 200" class="mt-2 w-full h-auto" role="img" aria-label="Price history chart for Raw NM and PSA 10"></svg>
    </section>

    <!-- Ventas recientes (card.js) -->
    <section class="mt-5" aria-labelledby="sales-title">
      <h2 id="sales-title" class="font-display font-semibold text-base">Recent sales</h2>
      <ul id="salesList" class="mt-2 divide-y divide-dark/10 rounded-2xl bg-white border border-dark/10 shadow-soft"></ul>
    </section>

    <!-- Otras cartas de la colección (card.js) -->
    <section class="mt-6" aria-labelledby="more-title">
      <h2 id="more-title" class="font-display font-semibold text-base">More from your collection</h2>
      <div id="moreCards" class="mt-2 flex gap-2.5 overflow-x-auto no-scrollbar py-2 px-0.5 snap-x"></div>
    </section>
    </div>
    </div>
  </main>

  <!-- Scripts: datos → utilidades → estructura común → lógica de la página -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/card.js"></script>
</body>
</html>
