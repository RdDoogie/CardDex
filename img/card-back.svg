<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 880" role="img" aria-label="Back of a trading card">
  <!-- Reverso genérico de carta (diseño propio, sin logotipos) -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#3f7be0"/>
      <stop offset=".45" stop-color="#1d4fb8"/>
      <stop offset="1" stop-color="#0d2a6e"/>
    </radialGradient>
    <linearGradient id="swirl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7fb2ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner"><rect x="34" y="34" width="562" height="812" rx="22"/></clipPath>
  </defs>

  <!-- Borde exterior -->
  <rect width="630" height="880" rx="34" fill="#1b3f96"/>
  <rect x="14" y="14" width="602" height="852" rx="28" fill="none" stroke="#2c5cc4" stroke-width="6"/>

  <!-- Fondo interior con remolino -->
  <g clip-path="url(#inner)">
    <rect x="34" y="34" width="562" height="812" fill="url(#core)"/>
    <g fill="none" stroke="url(#swirl)" stroke-width="26" stroke-linecap="round">
      <path d="M315 440 m-60 0 a60 60 0 1 1 120 0 a120 120 0 1 1 -240 0 a180 180 0 1 1 360 0 a240 240 0 1 1 -480 0 a300 300 0 1 1 600 0"/>
    </g>
    <g fill="#ffffff" opacity=".08">
      <circle cx="120" cy="150" r="70"/><circle cx="520" cy="740" r="90"/><circle cx="500" cy="170" r="40"/><circle cx="110" cy="720" r="45"/>
    </g>
  </g>

  <!-- Bola central -->
  <g transform="translate(315 440)">
    <circle r="118" fill="#0b1a45" opacity=".35"/>
    <circle r="104" fill="#FEFEFF"/>
    <path d="M-104 0a104 104 0 0 1 208 0z" fill="#E70E02"/>
    <path d="M-104 0h208" stroke="#191D32" stroke-width="16"/>
    <circle r="104" fill="none" stroke="#191D32" stroke-width="12"/>
    <circle r="34" fill="#FEFEFF" stroke="#191D32" stroke-width="14"/>
    <path d="M-70 -62a95 95 0 0 1 60 -30" stroke="#ffffff" stroke-opacity=".6" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>
</svg>
